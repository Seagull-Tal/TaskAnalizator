spring:
  application:
    name: TaskAnalizator

  datasource:
    url: jdbc:postgresql://localhost:5432/Tickets
    username: postgres
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080